services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-lvbl}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lvbattleleague}
      - STARTGG_API_TOKEN=${STARTGG_API_TOKEN}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - OVERLAY_API_KEY=${OVERLAY_API_KEY}
      - NODE_ENV=${NODE_ENV:-production}
    depends_on:
      - db
    volumes:
      # Source mounted read-only; uploads dir is the only writable path in the tree.
      - .:/app:ro
      - /app/node_modules
      - ./public/img/sponsors:/app/public/img/sponsors
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lvbattleleague}
      POSTGRES_USER: ${POSTGRES_USER:-lvbl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # Postgres is reachable by the app over the internal compose network only —
    # not published to the host. Use `docker compose exec db psql ...` for access.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
volumes:
  pgdata:
