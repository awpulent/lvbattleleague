<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LVBL Stream Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 1920px;
            height: 1080px;
            background: transparent;
            font-family: 'Barlow', sans-serif;
            overflow: hidden;
        }

        /* Player stat cards — bottom corners */
        .stat-card {
            position: absolute;
            bottom: 100px;
            padding: 12px 18px;
            background: rgba(10, 10, 15, 0.9);
            border: 1px solid rgba(255, 215, 0, 0.3);
            opacity: 0;
            transition: opacity 0.5s ease;
            max-width: 300px;
        }

        .stat-card.visible { opacity: 1; }

        .p1-stats { left: 30px; }
        .p2-stats { right: 30px; text-align: right; }

        .stat-card .stat-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.3rem;
            color: #FFD700;
            margin-bottom: 4px;
        }

        .stat-card .stat-line {
            font-size: 0.85rem;
            color: #E8E8E8;
            margin-bottom: 2px;
        }

        .stat-card .stat-value {
            color: #00E5FF;
            font-weight: 800;
        }

        .stat-card .stat-rank {
            color: #FFD700;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <!-- Player stat cards -->
    <div class="stat-card p1-stats" id="p1Stats"></div>
    <div class="stat-card p2-stats" id="p2Stats"></div>

    <script src="config.js"></script>
    <script>
        // State
        let lastP1Name = '';
        let lastP2Name = '';

        // Fetch from LVBL API
        async function apiFetch(endpoint) {
            const res = await fetch(`${LVBL_CONFIG.apiUrl}/api${endpoint}`, {
                headers: { 'Authorization': `Bearer ${LVBL_CONFIG.apiKey}` }
            });
            if (!res.ok) return null;
            return res.json();
        }

        // Search for a player by name
        async function findPlayer(name) {
            if (!name || name.length < 2) return null;
            const results = await apiFetch(`/players/search?name=${encodeURIComponent(name)}`);
            if (!results || !results.length) return null;
            return results.find(r => r.display_name.toLowerCase() === name.toLowerCase()) || results[0];
        }

        // Get player stats
        async function getPlayerStats(playerId) {
            return apiFetch(`/players/${playerId}/stats`);
        }

        // Render stat card
        function renderStatCard(elementId, stats) {
            const el = document.getElementById(elementId);
            if (!stats) {
                el.classList.remove('visible');
                return;
            }
            el.innerHTML = `
                <div class="stat-name">${stats.name}</div>
                <div class="stat-line">Record: <span class="stat-value">${stats.wins}W - ${stats.losses}L (${stats.winrate}%)</span></div>
                ${stats.rank ? `<div class="stat-line">Season Rank: <span class="stat-rank">#${stats.rank}</span></div>` : ''}
                ${stats.characters.length ? `<div class="stat-line">Main: <span class="stat-value">${stats.characters[0].name}</span></div>` : ''}
            `;
            el.classList.add('visible');
        }

        // Update stats when players change
        async function updateStats(p1Name, p2Name) {
            const [p1Result, p2Result] = await Promise.all([
                findPlayer(p1Name),
                findPlayer(p2Name)
            ]);

            const [p1Data, p2Data] = await Promise.all([
                p1Result ? getPlayerStats(p1Result.id) : null,
                p2Result ? getPlayerStats(p2Result.id) : null
            ]);

            renderStatCard('p1Stats', p1Data);
            renderStatCard('p2Stats', p2Data);
        }

        // Poll StreamControl JSON
        async function pollStreamControl() {
            try {
                const res = await fetch(`${LVBL_CONFIG.streamControlJson}?t=${Date.now()}`);
                if (!res.ok) return;
                const data = await res.json();

                const p1Name = (data.p1Name || '').trim();
                const p2Name = (data.p2Name || '').trim();

                // If players changed, fetch new stats
                if (p1Name !== lastP1Name || p2Name !== lastP2Name) {
                    lastP1Name = p1Name;
                    lastP2Name = p2Name;
                    if (p1Name && p2Name) {
                        await updateStats(p1Name, p2Name);
                    } else {
                        document.getElementById('p1Stats').classList.remove('visible');
                        document.getElementById('p2Stats').classList.remove('visible');
                    }
                }
            } catch (e) {
                // streamcontrol.json not found or not ready
            }
        }

        // Start polling
        setInterval(pollStreamControl, LVBL_CONFIG.pollInterval);
        pollStreamControl();
    </script>
</body>
</html>
