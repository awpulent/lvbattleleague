<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LVBL Stream Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 1920px;
            height: 1080px;
            background: transparent;
            font-family: 'Barlow', sans-serif;
            overflow: hidden;
            text-transform: uppercase;
        }

        /* ===== SCOREBOARD BAR (matches fgc-scoreboard style) ===== */

        /* Background layer */
        #scoreboardBG {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 60px;
        }

        .BGWrapper {
            position: absolute;
            top: 0;
            height: 45px;
        }

        #leftBGWrapper { left: 456px; }
        #rightBGWrapper { left: 1116px; }

        .playerBG {
            position: absolute;
            width: 375px;
            height: 45px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #c40a18;
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.6));
        }

        #p1PlayerBG { transform: skewX(20deg); }
        #p2PlayerBG { transform: skewX(-20deg); }

        .scoreBG {
            position: absolute;
            width: 49px;
            height: calc(100% - 4px);
            background: #c40a18;
            border: 1px solid black;
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.6));
        }

        #p1ScoreBG { left: 0; transform: skewX(20deg); }
        #p2ScoreBG { left: 375px; transform: skewX(-20deg); }

        #roundBG {
            position: absolute;
            left: 856px;
            width: 240px;
            height: 36px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #c40a18;
            transform: perspective(100px) rotateX(-18deg);
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.6));
        }

        /* Foreground content layer */
        #scoreboard {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 60px;
        }

        #leftWrapper, #rightWrapper {
            position: absolute;
            top: 0;
            height: 45px;
            display: flex;
            align-items: center;
        }

        #leftWrapper { left: 400px; flex-direction: row; }
        #rightWrapper { left: 1120px; flex-direction: row-reverse; }

        .scores {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 41px;
            height: 41px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 34px;
            color: white;
            -webkit-text-stroke: 1px black;
            text-shadow: 2px 2px 3px DimGray;
            z-index: 2;
        }

        .wrappers {
            display: flex;
            align-items: center;
            height: 45px;
            padding: 0 15px;
            min-width: 340px;
        }

        #leftWrapper .wrappers { justify-content: flex-start; }
        #rightWrapper .wrappers { justify-content: flex-end; }

        .teams {
            font-family: 'Barlow', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: #e5e5e5;
            text-shadow: 2px 2px 3px DimGray;
            margin-right: 8px;
        }

        #rightWrapper .teams {
            margin-right: 0;
            margin-left: 8px;
        }

        .names {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 30px;
            color: white;
            text-shadow: 2px 2px 3px DimGray;
            white-space: nowrap;
        }

        #rdWrapper {
            position: absolute;
            left: 856px;
            top: 0;
            width: 240px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #round {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 22px;
            color: white;
            text-shadow: 2px 2px 3px DimGray;
            white-space: nowrap;
        }

        /* ===== ENTRANCE ANIMATIONS ===== */

        .slidedown {
            animation: slidedown 0.26s ease-out forwards;
        }

        .player1-animation {
            animation: player1slidein 0.26s ease-out forwards;
        }

        .player2-animation {
            animation: player2slidein 0.26s ease-out forwards;
        }

        .p1s-animation {
            animation: p1score 0.26s ease-out 0.2s forwards;
            opacity: 0;
        }

        .p2s-animation {
            animation: p2score 0.26s ease-out 0.2s forwards;
            opacity: 0;
        }

        @keyframes slidedown {
            from { top: -40px; opacity: 0; }
            to { top: 0px; opacity: 1; }
        }

        @keyframes player1slidein {
            from { width: 90px; opacity: 0; }
            to { width: 375px; opacity: 1; }
        }

        @keyframes player2slidein {
            from { width: 90px; opacity: 0; }
            to { width: 375px; opacity: 1; }
        }

        @keyframes p1score {
            from { left: 375px; opacity: 0; }
            to { left: 0px; opacity: 1; }
        }

        @keyframes p2score {
            from { left: 0px; opacity: 0; }
            to { left: 375px; opacity: 1; }
        }

        /* ===== PLAYER STAT CARDS (LVBL addition) ===== */

        .stat-card {
            position: absolute;
            bottom: 100px;
            padding: 12px 18px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #c40a18;
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.6));
            opacity: 0;
            transition: opacity 0.5s ease;
            max-width: 300px;
        }

        .stat-card.visible { opacity: 1; }

        .p1-stats { left: 30px; }
        .p2-stats { right: 30px; text-align: right; }

        .stat-card .stat-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.3rem;
            color: #c40a18;
            margin-bottom: 4px;
        }

        .stat-card .stat-line {
            font-size: 0.85rem;
            color: white;
            text-shadow: 2px 2px 3px DimGray;
            margin-bottom: 2px;
        }

        .stat-card .stat-value {
            color: #00E5FF;
            font-weight: 800;
        }

        .stat-card .stat-rank {
            color: #FFD700;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <!-- Scoreboard background layer -->
    <div id="scoreboardBG">
        <div id="roundBG" class="slidedown"></div>
        <div id="leftBGWrapper" class="BGWrapper">
            <div id="p1ScoreBG" class="scoreBG p1s-animation"></div>
            <div id="p1PlayerBG" class="playerBG player1-animation"></div>
        </div>
        <div id="rightBGWrapper" class="BGWrapper">
            <div id="p2ScoreBG" class="scoreBG p2s-animation"></div>
            <div id="p2PlayerBG" class="playerBG player2-animation"></div>
        </div>
    </div>

    <!-- Scoreboard content layer -->
    <div id="scoreboard">
        <div id="leftWrapper">
            <span id="p1Score" class="scores">0</span>
            <span id="p1Wrapper" class="wrappers">
                <span id="p1Team" class="teams"></span>
                <span id="p1Name" class="names">Player 1</span>
            </span>
        </div>
        <div id="rightWrapper">
            <span id="p2Score" class="scores">0</span>
            <span id="p2Wrapper" class="wrappers">
                <span id="p2Team" class="teams"></span>
                <span id="p2Name" class="names">Player 2</span>
            </span>
        </div>
        <div id="rdWrapper">
            <span id="round">-</span>
        </div>
    </div>

    <!-- Player stat cards (LVBL) -->
    <div class="stat-card p1-stats" id="p1Stats"></div>
    <div class="stat-card p2-stats" id="p2Stats"></div>

    <script src="config.js"></script>
    <script>
        // State
        let lastP1Name = '';
        let lastP2Name = '';
        let lastData = {};

        // Fetch from LVBL API
        async function apiFetch(endpoint) {
            const res = await fetch(`${LVBL_CONFIG.apiUrl}/api${endpoint}`, {
                headers: { 'Authorization': `Bearer ${LVBL_CONFIG.apiKey}` }
            });
            if (!res.ok) return null;
            return res.json();
        }

        // Search for a player by name
        async function findPlayer(name) {
            if (!name || name.length < 2) return null;
            const results = await apiFetch(`/players/search?name=${encodeURIComponent(name)}`);
            if (!results || !results.length) return null;
            return results.find(r => r.display_name.toLowerCase() === name.toLowerCase()) || results[0];
        }

        // Get player stats
        async function getPlayerStats(playerId) {
            return apiFetch(`/players/${playerId}/stats`);
        }

        // Render stat card
        function renderStatCard(elementId, stats) {
            const el = document.getElementById(elementId);
            if (!stats) {
                el.classList.remove('visible');
                return;
            }
            el.innerHTML = `
                <div class="stat-name">${stats.name}</div>
                <div class="stat-line">Record: <span class="stat-value">${stats.wins}W - ${stats.losses}L (${stats.winrate}%)</span></div>
                ${stats.rank ? `<div class="stat-line">Season Rank: <span class="stat-rank">#${stats.rank}</span></div>` : ''}
                ${stats.characters.length ? `<div class="stat-line">Main: <span class="stat-value">${stats.characters[0].name}</span></div>` : ''}
            `;
            el.classList.add('visible');
        }

        // Update stats when players change
        async function updateStats(p1Name, p2Name) {
            const [p1Result, p2Result] = await Promise.all([
                findPlayer(p1Name),
                findPlayer(p2Name)
            ]);

            const [p1Data, p2Data] = await Promise.all([
                p1Result ? getPlayerStats(p1Result.id) : null,
                p2Result ? getPlayerStats(p2Result.id) : null
            ]);

            renderStatCard('p1Stats', p1Data);
            renderStatCard('p2Stats', p2Data);
        }

        // Update scoreboard display from StreamControl data
        function updateScoreboard(data) {
            const p1Name = (data.p1Name || '').trim();
            const p2Name = (data.p2Name || '').trim();

            document.getElementById('p1Name').textContent = p1Name || 'Player 1';
            document.getElementById('p2Name').textContent = p2Name || 'Player 2';
            document.getElementById('p1Score').textContent = data.p1Score || '0';
            document.getElementById('p2Score').textContent = data.p2Score || '0';
            document.getElementById('p1Team').textContent = data.p1Team || '';
            document.getElementById('p2Team').textContent = data.p2Team || '';
            document.getElementById('round').textContent = data.round || '-';
        }

        // Poll StreamControl JSON
        async function pollStreamControl() {
            try {
                const res = await fetch(`${LVBL_CONFIG.streamControlJson}?t=${Date.now()}`);
                if (!res.ok) return;
                const data = await res.json();

                // Update scoreboard display
                updateScoreboard(data);

                const p1Name = (data.p1Name || '').trim();
                const p2Name = (data.p2Name || '').trim();

                // If players changed, fetch new stats
                if (p1Name !== lastP1Name || p2Name !== lastP2Name) {
                    lastP1Name = p1Name;
                    lastP2Name = p2Name;
                    if (p1Name && p2Name) {
                        await updateStats(p1Name, p2Name);
                    } else {
                        document.getElementById('p1Stats').classList.remove('visible');
                        document.getElementById('p2Stats').classList.remove('visible');
                    }
                }
            } catch (e) {
                // streamcontrol.json not found or not ready
            }
        }

        // Start polling
        setInterval(pollStreamControl, LVBL_CONFIG.pollInterval);
        pollStreamControl();
    </script>
</body>
</html>
